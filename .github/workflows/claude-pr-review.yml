name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 3"
          prompt: |
            이 PR의 변경 코드를 리뷰해줘.
            문제가 있는 부분만 지적하고, 문제 없는 부분은 생략해.

            ## 아키텍처 (ADR-002: 3-Layered + Rich Domain Model)
            - Controller → Service → Repository 레이어 경계 준수
            - Entity: 도메인 로직·상태 전이를 직접 캡슐화 (Tell, Don't Ask)
            - public setter 금지 — 상태 변경은 의미 있는 도메인 메서드로만
            - Entity 생성은 정적 팩토리 메서드(`create`, `of` 등)로만, `@Builder` 외부 노출 금지
            - `@NoArgsConstructor(access = AccessLevel.PROTECTED)` 필수
            - Service에서 getter 체이닝 후 직접 판단·변경하는 패턴 금지
            - DTO 변환: `ResponseDTO.from(entity)` 패턴, Service가 DTO 반환, Controller는 그대로 반환
            - `Entity.toXxx()` 형태의 DTO 변환 금지

            ## 예외 처리 (ADR-004)
            - 도메인 규칙 위반 → Entity가 `BusinessException` throw
            - 외부 시스템 장애 → Service가 `InfraException`으로 wrapping
            - 리소스 미존재(404) → Service에서 throw
            - 도메인별 ErrorCode enum 사용 (`STORE_001` 형식)
            - Controller에서 try-catch 금지

            ## JPA / Entity 매핑
            - `@Table(name=...)`, `@Column(name=...)`, `@JoinColumn(name=...)` — `docs/schema/ddl.sql`과 일치 여부
            - FK NOT NULL 컬럼의 `@ManyToOne`에는 `optional = false` 필수
            - `fetch = FetchType.LAZY` 기본
            - 소프트 딜리트: `deletedAt IS NULL`이 삭제 여부의 권위 있는 신호

            ## 일반
            - `@Transactional` 어노테이션은 Service 레이어에만
            - 민감 정보(비밀번호, 토큰 등) 로그 출력 금지
