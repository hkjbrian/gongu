spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMzJjaGFycw==
  access-expiration: 3600000
  refresh-expiration: 604800000

cors:
  allowed-origins: http://localhost:3000

order:
  reservation-ttl-minutes: 10

portone:
  webhook-secret: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw

resilience4j:
  # src/main/resources/application.yml 의 resilience4j.portone 설정과 동기화 유지 — ResilienceConfigParityTest 가 강제 (#214, #213)
  circuitbreaker:
    # LOWEST_PRECEDENCE(2147483647) − 5 = 원래 @Retry 기본 자리 (resilience4j-spring6-2.2.0 기준 Retry 기본값).
    # 값이 작을수록 바깥. CB를 @Retry보다 바깥으로 보내 재시도 3회를 CB 실패 1건으로 집계 (#213).
    circuit-breaker-aspect-order: 2147483642
    instances:
      portone:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
          - com.gongu.server.global.exception.BusinessException
  retry:
    # LOWEST_PRECEDENCE(2147483647) − 4 = 원래 @CircuitBreaker 기본 자리. @Retry를 @CircuitBreaker 안쪽으로 (#213).
    retry-aspect-order: 2147483643
    instances:
      portone:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
