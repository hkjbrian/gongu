spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:gongu_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 25
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000
  refresh-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  timezone: Asia/Seoul

portone:
  api-secret: ${PORTONE_API_SECRET}
  base-url: https://api.portone.io

resilience4j:
  circuitbreaker:
    instances:
      portone:
        # sliding-window / failure-rate 임계값은 현행 유지.
        # 정상 상황의 타임아웃 발생 빈도 실측 데이터가 없어 임의 조정하지 않는다.
        # 부하 테스트(#152 계열)로 baseline 확보 후 재조정 — 이슈 #214 참고.
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        # record-exceptions는 retry-exceptions와 동일 집합으로 유지한다.
        # 어긋나면 "재시도는 하지만 서킷 집계는 안 되는" 예외가 생겨
        # PG 완전 다운 시 서킷이 열리지 않는다 (이슈 #214).
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
            - com.gongu.server.global.exception.BusinessException
  retry:
    instances:
      portone:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

order:
  reservation-ttl-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: gongu-server
