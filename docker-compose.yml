services:
  redis:
    image: redis:7.4-alpine
    container_name: gongu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - gongu-net

  mysql:
    image: mysql:8.0
    container_name: gongu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./monitoring/mysql/init-exporter-user.sql:/docker-entrypoint-initdb.d/init-exporter-user.sql:ro
    networks:
      - gongu-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: gongu-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.username=exporter:exporter_password
      - --mysqld.address=mysql:3306
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gongu-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gongu-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gongu-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gongu-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - gongu-net

  server:
    container_name: gongu-server
    build: .
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: perf
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gongu-net

  mock-pg:
    build: ./load-test/mock-pg
    container_name: gongu-mock-pg
    ports:
      - "8090:8090"
    environment:
      - SERVER_WEBHOOK_URL=http://gongu-server:8080/payments/webhook
      - PORT=8090
    depends_on:
      server:
        condition: service_started
    networks:
      - gongu-net

  k6:
    image: grafana/k6:latest
    profiles:
      - k6
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    volumes:
      - ./load-test:/scripts
    environment:
      - BASE_URL=http://gongu-server:8080
      - MOCK_PG_URL=http://gongu-mock-pg:8090
      - ADMIN_EMAIL=${ADMIN_EMAIL:-uiwang_gongu@email.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-1234}
      - VU_COUNT=${VU_COUNT:-200}
      - STORE_ID=${STORE_ID:-1}
    networks:
      - gongu-net

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:

networks:
  gongu-net:
    driver: bridge
