openapi: 3.0.3

info:
  title: Groupick API
  description: |
    공급자 · 본사 · 오프라인 매장 · 고객, 4자 이해관계자 구조의 공동구매 이커머스 서비스 API입니다.

    ## 공통 응답 구조

    **성공**
    ```json
    {
      "code": "SUCCESS_CODE",
      "data": { ... }
    }
    ```

    **실패**
    ```json
    {
      "code": "ERROR_CODE",
      "errors": [
        {
          "field": "fieldName",
          "reason": "에러 사유"
        }
      ]
    }
    ```
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증
  - name: User
    description: 회원
  - name: Store
    description: 매장
  - name: Product
    description: 공구 상품
  - name: Order
    description: 주문
  - name: Payment
    description: 결제
  - name: Notification
    description: 알림
  - name: Admin
    description: 매장 관리자

paths:

  # ──────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────

  /auth/email-availability:
    get:
      tags: [Auth]
      summary: 이메일 중복 검사
      description: 이메일 중복 검사를 실행하는 API입니다.
      operationId: checkEmailAvailability
      parameters:
        - name: email
          in: query
          required: true
          description: 이메일 주소
          schema:
            type: string
            format: email
            example: hong@example.com
      responses:
        '200':
          description: 이메일 사용 가능 여부 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAvailabilityResponse'
              example:
                code: USER_EMAIL_AVAILABLE
                data:
                  available: true
        '409':
          description: 이미 사용 중인 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: USER_EMAIL_DUPLICATED
                errors:
                  - field: email
                    reason: 이미 사용 중인 이메일입니다.
        '422':
          description: 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                이메일_필수:
                  value:
                    code: VALIDATION_FAILED
                    errors:
                      - field: email
                        reason: 이메일은 필수입니다.
                이메일_형식_오류:
                  value:
                    code: VALIDATION_FAILED
                    errors:
                      - field: email
                        reason: 올바른 이메일 형식을 입력해주세요.

  /auth/oauth2/login:
    post:
      tags: [Auth]
      summary: 소셜 로그인
      description: 카카오, 구글, 네이버 소셜 로그인을 처리합니다. 최초 로그인 시 회원 자동 가입이 진행됩니다.
      operationId: oauthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                code: AUTH_LOGIN_SUCCESS
                data:
                  access_token: eyJhbGci...
                  refresh_token: eyJhbGci...
                  token_type: Bearer
                  expires_in: 3600
                  member:
                    id: 1
                    name: 홍길동
                    role: CUSTOMER
        '400':
          description: 지원하지 않는 소셜 로그인 제공자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_INVALID_PROVIDER
                errors:
                  - field: provider
                    reason: 지원하지 않는 소셜 로그인 제공자입니다.
        '422':
          description: 유효성 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: 토큰 갱신
      description: refresh_token으로 새 access_token을 발급합니다.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
              example:
                code: AUTH_TOKEN_REFRESHED
                data:
                  access_token: eyJhbGci...
                  expires_in: 3600
        '401':
          description: 유효하지 않은 refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                토큰_만료:
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    errors:
                      - field: refresh_token
                        reason: 만료된 refresh token입니다.
                토큰_유효하지않음:
                  value:
                    code: AUTH_TOKEN_INVALID
                    errors:
                      - field: refresh_token
                        reason: 유효하지 않은 refresh token입니다.

  /auth/store-admin/login:
    post:
      tags: [Auth]
      summary: 매장 관리자 로그인
      description: 매장 관리자 전용 이메일 + 비밀번호 로그인입니다.
      operationId: storeAdminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAdminLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAdminLoginResponse'
              example:
                code: AUTH_LOGIN_SUCCESS
                data:
                  access_token: eyJhbGci...
                  refresh_token: eyJhbGci...
                  token_type: Bearer
                  expires_in: 3600
                  admin:
                    id: 1
                    name: 김매장
                    store_id: 1
                    role: STORE_ADMIN
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: AUTH_INVALID_CREDENTIALS
                errors:
                  - field: email
                    reason: 이메일 또는 비밀번호가 올바르지 않습니다.
        '403':
          description: 비활성화된 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────
  # User
  # ──────────────────────────────────────────

  /members/me:
    get:
      tags: [User]
      summary: 내 정보 조회
      description: 로그인된 고객의 프로필 정보를 조회합니다.
      operationId: getMyInfo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                code: MEMBER_FOUND
                data:
                  id: 1
                  name: 홍길동
                  email: hong@example.com
                  phone: 010-1234-5678
                  preferred_store:
                    id: 1
                    name: 소도몰 강남점
                  connected_providers:
                    - KAKAO
                    - GOOGLE
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [User]
      summary: 내 정보 수정
      description: 이름, 전화번호를 수정합니다.
      operationId: updateMyInfo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /members/me/stores:
    post:
      tags: [User]
      summary: 이용 매장 등록
      description: 고객이 이용할 매장을 등록합니다. is_preferred를 true로 설정하면 주로 이용하는 매장으로 지정됩니다.
      operationId: registerUserStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserStoreRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserStoreResponse'
              example:
                code: MEMBER_STORE_REGISTERED
                data:
                  store_id: 1
                  store_name: 소도몰 강남점
                  is_preferred: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 매장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: STORE_NOT_FOUND
                errors:
                  - field: store_id
                    reason: 존재하지 않는 매장입니다.
        '409':
          description: 이미 등록된 매장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: MEMBER_STORE_DUPLICATE
                errors:
                  - field: store_id
                    reason: 이미 등록된 매장입니다.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ──────────────────────────────────────────
  # Store
  # ──────────────────────────────────────────

  /stores:
    get:
      tags: [Store]
      summary: 매장 목록 조회
      description: 전체 활성 매장 목록을 조회합니다.
      operationId: getStores
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'

  /stores/{store_id}:
    get:
      tags: [Store]
      summary: 매장 상세 조회
      operationId: getStore
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '404':
          description: 존재하지 않는 매장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: STORE_NOT_FOUND
                errors:
                  - field: store_id
                    reason: 존재하지 않는 매장입니다.

  # ──────────────────────────────────────────
  # Product
  # ──────────────────────────────────────────

  /products:
    get:
      tags: [Product]
      summary: 공구 상품 목록 조회 (진행중)
      description: 현재 진행 중인(ACTIVE) 공구 상품 목록을 조회합니다.
      operationId: getProducts
      parameters:
        - name: store_id
          in: query
          required: false
          description: 매장 ID로 필터링
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /products/{product_id}:
    get:
      tags: [Product]
      summary: 공구 상품 상세 조회
      operationId: getProduct
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          description: 존재하지 않는 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PRODUCT_NOT_FOUND
                errors:
                  - field: product_id
                    reason: 존재하지 않는 상품입니다.

  /admin/products:
    post:
      tags: [Product]
      summary: 공구 상품 등록
      description: 매장 관리자가 공구 상품을 등록합니다.
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
              example:
                code: PRODUCT_CREATED
                data:
                  id: 1
                  name: 유기농 사과 5kg
                  status: UPCOMING
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/products/{product_id}/arrive:
    put:
      tags: [Product]
      summary: 입고 처리
      description: 공구 물품 입고 처리 시 주문 상태를 ARRIVED로 일괄 변경하고, 고객에게 알림을 발송합니다.
      operationId: arriveProduct
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 입고 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArriveProductResponse'
              example:
                code: PRODUCT_ARRIVED
                data:
                  product_id: 1
                  notified_count: 43
                  arrived_order_count: 43
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 입고 처리된 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PRODUCT_ALREADY_ARRIVED
                errors: []

  # ──────────────────────────────────────────
  # Order
  # ──────────────────────────────────────────

  /orders:
    post:
      tags: [Order]
      summary: 주문 예약
      description: 공구 상품을 예약합니다. 선착순으로 재고를 선점하며, 재고 소진 시 즉시 실패합니다.
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                code: ORDER_CREATED
                data:
                  order_id: 1
                  status: RESERVED
                  product_id: 1
                  quantity: 2
                  total_price: 50000
                  created_at: '2026-03-30T10:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 재고 소진 또는 주문 불가 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                재고_소진:
                  value:
                    code: PRODUCT_SOLD_OUT
                    errors:
                      - field: product_id
                        reason: 재고가 소진되었습니다.
                주문_불가:
                  value:
                    code: PRODUCT_NOT_ACTIVE
                    errors:
                      - field: product_id
                        reason: 현재 주문 가능한 상품이 아닙니다.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /orders/me:
    get:
      tags: [Order]
      summary: 내 주문 목록 조회
      description: 로그인된 고객의 주문 목록을 조회합니다.
      operationId: getMyOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 주문 상태 필터
          schema:
            type: string
            enum: [RESERVED, PAID, ARRIVED, RECEIVED, CANCELLED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{order_id}:
    get:
      tags: [Order]
      summary: 주문 상세 조회
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ORDER_NOT_FOUND
                errors:
                  - field: order_id
                    reason: 존재하지 않는 주문입니다.

  /orders/{order_id}/cancel:
    post:
      tags: [Order]
      summary: 주문 취소
      description: 주문을 취소합니다. RESERVED 또는 PAID 상태에서만 취소 가능합니다. 결제 완료 건은 PG 자동 취소 처리됩니다.
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
              example:
                code: ORDER_CANCELLED
                data:
                  order_id: 1
                  status: CANCELLED
                  cancelled_at: '2026-03-30T11:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 취소 불가 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ORDER_CANNOT_CANCEL
                errors:
                  - field: ~
                    reason: 취소할 수 없는 주문 상태입니다.

  /orders/{order_id}/receive:
    post:
      tags: [Order]
      summary: 수령 완료 처리
      description: 고객이 물품 수령을 완료합니다. ARRIVED 상태에서만 가능합니다.
      operationId: receiveOrder
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 수령 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveOrderResponse'
              example:
                code: ORDER_RECEIVED
                data:
                  order_id: 1
                  status: RECEIVED
                  received_at: '2026-04-15T14:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 입고 전 수령 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ORDER_NOT_ARRIVED
                errors:
                  - field: ~
                    reason: 입고 완료된 주문만 수령 처리할 수 있습니다.

  # ──────────────────────────────────────────
  # Payment
  # ──────────────────────────────────────────

  /payments/verify:
    post:
      tags: [Payment]
      summary: 결제 검증 및 확정
      description: 포트원(PortOne) 결제 완료 후 서버 측 금액 검증 및 주문 확정을 처리합니다.
      operationId: verifyPayment
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 이중 결제 방지용 멱등성 키 (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
      responses:
        '200':
          description: 결제 검증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPaymentResponse'
              example:
                code: PAYMENT_VERIFIED
                data:
                  order_id: 1
                  imp_uid: imp_123456789
                  amount: 50000
                  status: PAID
                  paid_at: '2026-03-30T10:05:00'
                  order_status: PAID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않는 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 처리된 결제
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PAYMENT_ALREADY_PROCESSED
                errors:
                  - field: Idempotency-Key
                    reason: 이미 처리된 결제 요청입니다.
        '422':
          description: 결제 금액 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PAYMENT_AMOUNT_MISMATCH
                errors:
                  - field: ~
                    reason: 결제 금액이 주문 금액과 일치하지 않습니다.
        '502':
          description: PG사 통신 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PAYMENT_PG_ERROR
                errors:
                  - field: ~
                    reason: PG사 통신 오류가 발생했습니다.

  # ──────────────────────────────────────────
  # Notification
  # ──────────────────────────────────────────

  /notifications/me:
    get:
      tags: [Notification]
      summary: 내 알림 목록 조회
      operationId: getMyNotifications
      security:
        - BearerAuth: []
      parameters:
        - name: is_read
          in: query
          required: false
          description: 읽음 여부 필터 (미입력 시 전체)
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
              example:
                code: NOTIFICATION_LIST_FOUND
                data:
                  content:
                    - id: 1
                      type: ARRIVED
                      message: 유기농 사과 5kg 물품이 입고되었습니다.
                      is_read: false
                      sent_at: '2026-04-10T09:00:00'
                  unread_count: 1
                  total_elements: 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notification_id}/read:
    patch:
      tags: [Notification]
      summary: 알림 읽음 처리
      operationId: readNotification
      security:
        - BearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              example:
                code: NOTIFICATION_READ
                data:
                  id: 1
                  is_read: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 알림
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: NOTIFICATION_NOT_FOUND
                errors:
                  - field: notification_id
                    reason: 존재하지 않는 알림입니다.

  # ──────────────────────────────────────────
  # Admin
  # ──────────────────────────────────────────

  /admin/products/{product_id}/orders:
    get:
      tags: [Admin]
      summary: 주문 현황 조회 — 상품별
      description: 특정 공구 상품의 전체 주문 현황을 조회합니다.
      operationId: getOrdersByProduct
      security:
        - BearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [RESERVED, PAID, ARRIVED, RECEIVED, CANCELLED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              example:
                code: ADMIN_ORDER_LIST_FOUND
                data:
                  product_id: 1
                  product_name: 유기농 사과 5kg
                  total_orders: 43
                  status_summary:
                    RESERVED: 5
                    PAID: 30
                    ARRIVED: 6
                    RECEIVED: 2
                  content:
                    - order_id: 1
                      member_name: 홍길동
                      member_phone: 010-1234-5678
                      quantity: 2
                      total_price: 50000
                      status: PAID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/members/{member_id}/orders:
    get:
      tags: [Admin]
      summary: 주문 현황 조회 — 고객별
      description: 특정 고객의 매장 내 전체 주문 이력을 조회합니다.
      operationId: getOrdersByMember
      security:
        - BearerAuth: []
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              example:
                code: ADMIN_MEMBER_ORDER_LIST_FOUND
                data:
                  member_id: 1
                  member_name: 홍길동
                  total_orders: 3
                  content:
                    - order_id: 1
                      product_name: 유기농 사과 5kg
                      quantity: 2
                      total_price: 50000
                      status: RECEIVED
                      created_at: '2026-03-30T10:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/members:
    get:
      tags: [Admin]
      summary: 고객 목록 조회
      description: 매장에 등록된 고객 목록을 조회합니다.
      operationId: getAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          description: 이름으로 검색
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              example:
                code: ADMIN_MEMBER_LIST_FOUND
                data:
                  content:
                    - user_id: 1
                      name: 홍길동
                      phone: 010-1234-5678
                      order_count: 3
                      registered_at: '2026-01-15T10:00:00'
                  total_elements: 1
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ──────────────────────────────────────────
# Components
# ──────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인 후 발급된 JWT access_token을 입력하세요.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 페이지 번호 (기본값 0)
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기 (기본값 20)
      schema:
        type: integer
        default: 20

  responses:
    Unauthorized:
      description: 인증 토큰이 없거나 만료되었습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_UNAUTHORIZED
            errors: []
    Forbidden:
      description: 권한이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTH_FORBIDDEN
            errors: []
    ValidationFailed:
      description: 입력값 유효성 검사 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
            errors:
              - field: fieldName
                reason: 에러 사유

  schemas:

    # ── 공통 ──────────────────────────────
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: 에러 코드
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string

    PageInfo:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total_elements:
          type: integer
        total_pages:
          type: integer

    # ── Auth ──────────────────────────────
    EmailAvailabilityResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            available:
              type: boolean
              description: 사용 가능하면 true, 사용 불가능하면 false

    OAuthLoginRequest:
      type: object
      required: [provider, provider_id, name]
      properties:
        provider:
          type: string
          enum: [KAKAO, GOOGLE, NAVER]
        provider_id:
          type: string
          description: 소셜 플랫폼에서 발급한 고유 ID
        name:
          type: string
        email:
          type: string
          format: email

    LoginResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
            expires_in:
              type: integer
              description: 만료 시간 (초)
            member:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                name:
                  type: string
                role:
                  type: string
                  enum: [CUSTOMER, STORE_ADMIN, HQ_ADMIN]

    TokenRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenRefreshResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            expires_in:
              type: integer

    StoreAdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    StoreAdminLoginResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
            expires_in:
              type: integer
            admin:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                name:
                  type: string
                store_id:
                  type: integer
                  format: int64
                role:
                  type: string

    # ── User ────────────────────────────
    UserResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            preferred_store:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                name:
                  type: string
            connected_providers:
              type: array
              items:
                type: string
                enum: [KAKAO, GOOGLE, NAVER]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string

    UpdateUserResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            phone:
              type: string

    RegisterUserStoreRequest:
      type: object
      required: [store_id]
      properties:
        store_id:
          type: integer
          format: int64
        is_preferred:
          type: boolean
          default: false

    RegisterUserStoreResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            store_id:
              type: integer
              format: int64
            store_name:
              type: string
            is_preferred:
              type: boolean

    # ── Store ─────────────────────────────
    StoreListResponse:
      type: object
      properties:
        code:
          type: string
        data:
          allOf:
            - type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/StoreItem'
            - $ref: '#/components/schemas/PageInfo'

    StoreResponse:
      type: object
      properties:
        code:
          type: string
        data:
          $ref: '#/components/schemas/StoreItem'

    StoreItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        phone:
          type: string

    # ── Product ───────────────────────────
    ProductListResponse:
      type: object
      properties:
        code:
          type: string
        data:
          allOf:
            - type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductItem'
            - $ref: '#/components/schemas/PageInfo'

    ProductDetailResponse:
      type: object
      properties:
        code:
          type: string
        data:
          $ref: '#/components/schemas/ProductItem'

    ProductItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        store_id:
          type: integer
          format: int64
        store_name:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
          description: 원화 (BIGINT)
        total_stock:
          type: integer
        remaining_stock:
          type: integer
        status:
          type: string
          enum: [UPCOMING, ACTIVE, SOLD_OUT, CLOSED]
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name, price, total_stock, start_at, end_at]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
          minimum: 1
        total_stock:
          type: integer
          minimum: 1
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    CreateProductResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            status:
              type: string

    ArriveProductResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            product_id:
              type: integer
              format: int64
            notified_count:
              type: integer
            arrived_order_count:
              type: integer

    # ── Order ─────────────────────────────
    CreateOrderRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    CreateOrderResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: integer
              format: int64
            status:
              type: string
              enum: [RESERVED]
            product_id:
              type: integer
              format: int64
            quantity:
              type: integer
            total_price:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time

    OrderListResponse:
      type: object
      properties:
        code:
          type: string
        data:
          allOf:
            - type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
            - $ref: '#/components/schemas/PageInfo'

    OrderItem:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
        product_name:
          type: string
        quantity:
          type: integer
        total_price:
          type: integer
          format: int64
        status:
          type: string
          enum: [RESERVED, PAID, ARRIVED, RECEIVED, CANCELLED]
        created_at:
          type: string
          format: date-time

    OrderDetailResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: integer
              format: int64
            status:
              type: string
              enum: [RESERVED, PAID, ARRIVED, RECEIVED, CANCELLED]
            total_price:
              type: integer
              format: int64
            items:
              type: array
              items:
                type: object
                properties:
                  product_id:
                    type: integer
                    format: int64
                  product_name:
                    type: string
                  quantity:
                    type: integer
                  unit_price:
                    type: integer
                    format: int64
            payment:
              type: object
              properties:
                imp_uid:
                  type: string
                amount:
                  type: integer
                  format: int64
                status:
                  type: string
                  enum: [PENDING, PAID, CANCELLED, FAILED]
                paid_at:
                  type: string
                  format: date-time
            created_at:
              type: string
              format: date-time

    CancelOrderRequest:
      type: object
      properties:
        cancel_reason:
          type: string

    CancelOrderResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: integer
              format: int64
            status:
              type: string
            cancelled_at:
              type: string
              format: date-time

    ReceiveOrderResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: integer
              format: int64
            status:
              type: string
            received_at:
              type: string
              format: date-time

    # ── Payment ───────────────────────────
    VerifyPaymentRequest:
      type: object
      required: [imp_uid, merchant_uid, order_id]
      properties:
        imp_uid:
          type: string
          description: 포트원 결제 고유번호
        merchant_uid:
          type: string
          description: 우리 서버 주문번호
        order_id:
          type: integer
          format: int64

    VerifyPaymentResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            order_id:
              type: integer
              format: int64
            imp_uid:
              type: string
            amount:
              type: integer
              format: int64
            status:
              type: string
              enum: [PAID]
            paid_at:
              type: string
              format: date-time
            order_status:
              type: string
              enum: [PAID]

    # ── Notification ──────────────────────
    NotificationListResponse:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            content:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  type:
                    type: string
                    enum: [ARRIVED, ORDER_CONFIRMED, CANCELLED]
                  message:
                    type: string
                  is_read:
                    type: boolean
                  sent_at:
                    type: string
                    format: date-time
            unread_count:
              type: integer
            total_elements:
              type: integer
